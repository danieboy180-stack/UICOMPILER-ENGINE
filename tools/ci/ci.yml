name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: ci_gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Windows is the primary dev platform but its file-lock timing is slower and less
    # predictable; keep it advisory until it has a stable track record.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: python ci_gate.py
